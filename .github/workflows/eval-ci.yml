name: LearnAgent CI

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      run_full:
        description: "Run full profile (core + rag + e2e)"
        required: false
        type: boolean
        default: true
      enable_ragas:
        description: "Try RAGAS in auto mode"
        required: false
        type: boolean
        default: false

concurrency:
  group: learnagent-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval_core:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run PR delivery gate
        run: python scripts/verify_eval_suite.py --profile core-fast --summary-json artifacts/eval/eval-core-fast-summary.json

      - name: Build eval job summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def load(path: Path) -> dict:
              if not path.is_file():
                  return {}
              return json.loads(path.read_text(encoding="utf-8"))

          core = load(Path("artifacts/eval/eval-core-fast-summary.json"))
          overall = bool(core.get("overall_pass", False))
          lines = [
              "## LearnAgent CI Summary",
              f"- overall_pass: {overall}",
              f"- profile: {core.get('profile')}",
              f"- duration_ms: {core.get('duration_total_ms')}",
              "",
              "### delivery_gate",
              f"- overall_pass: {core.get('overall_pass')}",
              f"- suites_total: {core.get('suites_total')}",
              f"- suites_failed: {core.get('suites_failed')}",
              f"- failed_suites: {', '.join(core.get('failed_suites', [])) or '(none)'}",
              f"- failed_cases: {', '.join(core.get('failed_cases', [])) or '(none)'}",
              f"- contract_schema_ok: {core.get('contract_schema_ok')}",
              f"- runtime_contract_breaks: {', '.join(core.get('runtime_contract_breaks', [])) or '(none)'}",
          ]
          summary_file = Path(__import__("os").environ["GITHUB_STEP_SUMMARY"])
          summary_file.write_text("\n".join(lines) + "\n", encoding="utf-8")
          if not overall:
              raise SystemExit(1)
          PY

      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-pr-artifacts
          path: |
            artifacts/eval/eval-core-fast-summary.json
            artifacts/runtime/*.json
          if-no-files-found: warn

  eval_full_nightly:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_full == true) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-vector.txt

      - name: Restore RAG metrics history
        uses: actions/cache@v4
        with:
          path: artifacts/eval/rag_metrics/history
          key: rag-metrics-history-${{ github.run_id }}
          restore-keys: |
            rag-metrics-history-

      - name: Restore HuggingFace model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-rag-models-${{ runner.os }}-bge-large-zh-v1.5-bge-reranker-base
          restore-keys: |
            hf-rag-models-${{ runner.os }}-

      - name: Preload nightly RAG models
        continue-on-error: true
        run: |
          python - <<'PY'
          from sentence_transformers import CrossEncoder, SentenceTransformer

          SentenceTransformer("BAAI/bge-large-zh-v1.5")
          CrossEncoder("BAAI/bge-reranker-base")
          PY

      - name: Run eval full profile
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python scripts/verify_eval_suite.py --profile full
          elif [ "${{ inputs.enable_ragas }}" = "true" ]; then
            python scripts/verify_eval_suite.py --profile full --enable-ragas
          else
            python scripts/verify_eval_suite.py --profile full
          fi

      - name: Build nightly summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("artifacts/eval/eval-suite-summary.json")
          if not p.exists():
              print("No eval summary found.")
              raise SystemExit(0)
          payload = json.loads(p.read_text(encoding="utf-8"))
          failed = payload.get("failed_suites", [])
          failed_cases = payload.get("failed_cases", [])
          rag_metrics = payload.get("rag_metrics", {})
          rag_regression = payload.get("rag_regression", {})
          nightly_metrics_path = Path("artifacts/eval/rag_metrics/nightly-latest.json")
          nightly_payload = {}
          if nightly_metrics_path.is_file():
              nightly_payload = json.loads(nightly_metrics_path.read_text(encoding="utf-8"))
          nightly_reason = (
              nightly_payload.get("skip_reason")
              or nightly_payload.get("timeout_stage")
              or rag_regression.get("reason")
              or ""
          )
          lines = [
              "## Eval Full Summary",
              f"- overall_pass: {payload.get('overall_pass')}",
              f"- suites_total: {payload.get('suites_total')}",
              f"- suites_failed: {payload.get('suites_failed')}",
              f"- skipped_suites: {', '.join(payload.get('skipped_suites', [])) or '(none)'}",
              f"- failed_suites: {', '.join(failed) if failed else '(none)'}",
              f"- failed_cases: {', '.join(failed_cases) if failed_cases else '(none)'}",
              f"- failed_scenarios: {', '.join(payload.get('failed_scenarios', [])) or '(none)'}",
              f"- runtime_contract_breaks: {', '.join(payload.get('runtime_contract_breaks', [])) or '(none)'}",
              f"- contract_schema_ok: {payload.get('contract_schema_ok')}",
              f"- rag_metrics: {json.dumps(rag_metrics, ensure_ascii=False)}",
              f"- rag_regression: {json.dumps(rag_regression, ensure_ascii=False)}",
              f"- metrics_path_exists: {nightly_metrics_path.is_file()}",
              f"- phase4_ragas_nightly.status: {nightly_payload.get('status', 'MISSING')}",
              f"- nightly_stage: {nightly_payload.get('stage', 'n/a')}",
              f"- nightly_reason: {nightly_reason}",
              f"- nightly_embedding_model: {nightly_payload.get('embedding_model', 'n/a')}",
              f"- nightly_vector_enabled: {nightly_payload.get('vector_enabled')}",
              f"- nightly_rerank_enabled: {nightly_payload.get('rerank_enabled')}",
          ]
          summary_file = Path(__import__("os").environ["GITHUB_STEP_SUMMARY"])
          summary_file.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Upload full eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-full-artifacts
          path: |
            artifacts/eval/eval-suite-summary.json
            artifacts/eval/rag_metrics/
            artifacts/runtime/*.json
            artifacts/phase4/*.json
          if-no-files-found: warn
